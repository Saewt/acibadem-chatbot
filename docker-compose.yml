services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./webapp
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${ACIBADEM_DATASET_HOST_ROOT:-./data/acibadem-dataset}:/data/acibadem-dataset:ro
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class gthread --threads 2 --timeout 300 --access-logfile -"

  bootstrap:
    build: ./webapp
    profiles:
      - bootstrap
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${ACIBADEM_DATASET_HOST_ROOT:-./data/acibadem-dataset}:/data/acibadem-dataset:ro
    command: >
      sh -c "python manage.py migrate &&
             exec python manage.py bootstrap_knowledge"

  scheduler:
    build: ./webapp
    profiles:
      - scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${ACIBADEM_DATASET_HOST_ROOT:-./data/acibadem-dataset}:/data/acibadem-dataset:ro
    command: >
      sh -c "exec python manage.py run_knowledge_scheduler"

volumes:
  postgres_data:
  redis_data:
